<!DOCTYPE html>
<html>
<head>
    <title>My AI Assistant</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body>

<div class="app">

    <!-- Sidebar -->
    <aside class="sidebar">
        <button id="new-chat">+ New Chat</button>
        <div id="conversations">
            <!-- Conversations will be added here by JavaScript -->
        </div>

    </aside>

    <!-- Main chat area -->
    <main class="chat-container">

        <header class="chat-header">
            <button id="toggle-sidebar">☰</button>
            <h1 id="title-heading">Your AI Assistant</h1>
        </header>

        <div id="messages" class="messages">
            <!-- Messages will be added here -->
        </div>

        <div class="input-area">
            <textarea id="message-input" type="text" placeholder="Ask something..."></textarea>
            <button id="send">Send</button>
        </div>

        
        <div id="modal" class="modal hidden">
            <div class="modal-content">
                <h3 id="modal-title">Rename conversation</h3>
                <input id="modal-input" type="text">
                <div>
                    <button id="modal-cancel">Cancel</button>
                    <button id="modal-confirm">Save</button>
                </div>
            </div>
        </div>


    </main>

</div>

<script src="/script.js"></script>

</body>
</html>
